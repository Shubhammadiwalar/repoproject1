[phases.setup]
nixPkgs = ["python311", "libGL", "libGLU", "glib", "libstdcxx5"]

[phases.install]
cmds = [
  "pip install --upgrade pip setuptools wheel",
  "pip install torch==2.1.0 torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cpu --no-cache-dir",
  "pip install -r requirements.txt --no-cache-dir"
]

[start]
cmd = "gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 180 --preload"
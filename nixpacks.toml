[phases.setup]
nixPkgs = ["python311", "libGL", "libGLU", "glib"]

[phases.install]
cmds = [
  "pip install --upgrade pip",
  "pip install torch==2.11.0 torchvision==0.26.0 --index-url https://download.pytorch.org/whl/cpu",
  "pip install -r requirements.txt --no-deps --ignore-installed torch torchvision"
]

[start]
cmd = "gunicorn backend.app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload"